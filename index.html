<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix-Style TV Show Browser</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo">
        </div>
        <div class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">TV Shows</a>
            <a href="#">Movies</a>
            <a href="#">New & Popular</a>
            <a href="#">My List</a>
        </div>
        <div class="nav-right">
            <i class="fas fa-search"></i>
            <i class="fas fa-bell"></i>
            <div class="profile">
                <img src="https://via.placeholder.com/32" alt="Profile">
            </div>
        </div>
    </nav>

    <div class="hero">
        <div class="hero-content">
            <h1>Stranger Things</h1>
            <p>When a young boy vanishes, a small town uncovers a mystery involving secret experiments, terrifying supernatural forces and one strange little girl.</p>
            <div class="hero-buttons">
                <button class="play-btn"><i class="fas fa-play"></i> Play</button>
                <button class="info-btn"><i class="fas fa-info-circle"></i> More Info</button>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="row">
            <h2>Trending Now</h2>
            <div class="row-content">
                <!-- TV show cards will be dynamically added here -->
            </div>
        </div>
        <div class="row">
            <h2>Popular on Netflix</h2>
            <div class="row-content">
                <!-- TV show cards will be dynamically added here -->
            </div>
        </div>
        <div class="row">
            <h2>New Releases</h2>
            <div class="row-content">
                <!-- TV show cards will be dynamically added here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
